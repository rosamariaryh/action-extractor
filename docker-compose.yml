services:
  api:
    build: .
    container_name: action-extractor
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4317
    depends_on:
      redis:
        condition: service_started
      phoenix:
        condition: service_healthy

  evals:
    profiles: ["eval"]
    build: .
    env_file:
      - .env
    environment:
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4317
      - PHOENIX_UI_ENDPOINT=http://phoenix:6006
      - EVAL_OUTPUT_DIR=/app/evals/output
    entrypoint: ["python", "-m", "evals.main"]
    volumes:
      - ./input_data:/app/input_data:ro
      - ./output:/app/output:ro
      - ./eval_output:/app/eval_output
      - ./evals/output:/app/evals/output
    depends_on:
      phoenix:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  phoenix:
    # Keep the server API aligned with arize-phoenix in uv.lock.
    image: arizephoenix/phoenix:21.0.0
    container_name: phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:6006/openapi.json', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
      - PHOENIX_ENABLE_AUTH=false
      - PHOENIX_SECRET=${PHOENIX_SECRET}
      - PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD=${PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD}
    volumes:
      - phoenix_data:/mnt/data
volumes:
  phoenix_data:
